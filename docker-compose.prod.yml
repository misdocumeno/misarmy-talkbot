# Production: pull the bot image from GHCR (no local build).
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# On a prod host, set once so plain `docker compose up` works:
#   export COMPOSE_FILE=docker-compose.prod.yml
# (e.g. in ~/.bashrc or a small env file you source before deploy)
#
# Always includes observability (Prometheus / Loki / Tempo / Grafana / Alloy)
# so rare stalls are caught without enabling a separate profile.
# Grafana: http://<host>:3000  (GRAFANA_* / GitHub OAuth via .env)

services:
  misarmy_talkbot:
    image: ghcr.io/misdocumeno/misarmy-talkbot:latest
    pull_policy: always
    depends_on:
      lavalink:
        condition: service_healthy
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
    volumes:
      - misarmy-talkbot-config:/home/bot/config
      - audio-tmpfs:/tmp/talkbot-audio
    env_file:
      - .env
    environment:
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      AUDIO_DIR: /tmp/talkbot-audio
      AUDIO_HTTP_HOST: "0.0.0.0"
      AUDIO_HTTP_PORT: "8765"
      AUDIO_HTTP_PUBLIC_BASE: http://misarmy_talkbot:8765
      METRICS_HTTP_HOST: "0.0.0.0"
      METRICS_HTTP_PORT: "9100"
      OTEL_SERVICE_NAME: misarmy-talkbot
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      STALL_NO_PROGRESS_SEC: "30"
      STALL_TTS_ZERO_PROGRESS_SEC: "60"
    restart: unless-stopped

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - audio-tmpfs:/tmp/talkbot-audio
    environment:
      _JAVA_OPTIONS: "-Xmx512m"
      SERVER_PORT: "2333"
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header=\"Authorization: $$LAVALINK_SERVER_PASSWORD\" http://localhost:2333/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=48h
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ./deploy/observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: [-config.file=/etc/tempo/config.yml]
    volumes:
      - ./deploy/observability/tempo-config.yml:/etc/tempo/config.yml:ro

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-talkbot}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: ${GRAFANA_AUTO_ORG_ROLE:-Admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: ${GRAFANA_BASIC_AUTH:-true}
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-false}
      GF_AUTH_GITHUB_ENABLED: ${GRAFANA_GITHUB_ENABLED:-false}
      GF_AUTH_GITHUB_ALLOW_SIGN_UP: ${GRAFANA_GITHUB_ALLOW_SIGN_UP:-true}
      GF_AUTH_GITHUB_CLIENT_ID: ${GRAFANA_GITHUB_CLIENT_ID:-}
      GF_AUTH_GITHUB_CLIENT_SECRET: ${GRAFANA_GITHUB_CLIENT_SECRET:-}
      GF_AUTH_GITHUB_SCOPES: user:email,read:org
      GF_AUTH_GITHUB_AUTH_URL: https://github.com/login/oauth/authorize
      GF_AUTH_GITHUB_TOKEN_URL: https://github.com/login/oauth/access_token
      GF_AUTH_GITHUB_API_URL: https://api.github.com/user
      GF_AUTH_GITHUB_ALLOWED_ORGANIZATIONS: ${GRAFANA_GITHUB_ALLOWED_ORGS:-}
      GF_AUTH_GITHUB_TEAM_IDS: ${GRAFANA_GITHUB_TEAM_IDS:-}
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
    volumes:
      - ./deploy/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      - loki

volumes:
  misarmy-talkbot-config:
  audio-tmpfs:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=128m,mode=1777"
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:
